packages:
  - .

blockExoticSubdeps: true

lockfileIncludeTarballUrl: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - "@hemilabs/*"

onlyBuiltDependencies:
  - "@hemilabs/wallet-watch-asset"

overrides:
  # @walletconnect/relay-auth@1.1.0 (pulled in transitively via wagmi) exact-pins
  # @noble/hashes@1.7.0 and @noble/curves@1.8.0. Both were published on
  # 2025-01-03 without provenance attestation (earlier releases had it), so
  # our `trustPolicy: no-downgrade` rejects them. The next patches (1.7.1 /
  # 1.8.1, both published 2025-01-18) restored attestation. We redirect to
  # attested versions already present elsewhere in the tree.
  # Remove this once relay-auth ships a release that doesn't pin those:
  # https://github.com/WalletConnect/walletconnect-utils/pull/244
  "@noble/curves@1.8.0": 1.8.1
  "@noble/hashes@1.7.0": 1.8.0
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
  axios@>=1.0.0 <1.15.2: ">=1.15.2"
  bn.js@>=5.0.0 <5.2.3: ">=5.2.3"
  brace-expansion@<1.1.13: ">=1.1.13"
  brace-expansion@>=2.0.0 <2.0.3: ">=2.0.3"
  defu@<=6.1.4: ">=6.1.5"
  fast-uri@<=3.1.1: ">=3.1.2"
  flatted@<=3.4.1: ">=3.4.2"
  follow-redirects@<=1.15.11: ">=1.16.0"
  h3@<1.15.9: ">=1.15.9"
  hono@<4.12.18: ">=4.12.18"
  lodash@<=4.17.23: ">=4.18.0"
  markdown-it@>=13.0.0 <14.1.1: ">=14.1.1"
  minimatch@<3.1.4: ">=3.1.4"
  minimatch@>=9.0.0 <9.0.7: ">=9.0.7"
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  postcss@<8.5.10: ">=8.5.10"
  rollup@>=4.0.0 <4.59.0: ">=4.59.0"
  smol-toml@<1.6.1: ">=1.6.1"
  socket.io-parser@>=4.0.0 <4.2.6: ">=4.2.6"
  vite@>=7.0.0 <=7.3.1: ">=7.3.2"
  yaml@>=2.0.0 <2.8.3: ">=2.8.3"

trustPolicy: no-downgrade
